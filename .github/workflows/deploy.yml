name: Deploy frontend — Cloudflare Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: monabid
  PUBLISH_DIR: packages/assistant-client/dist
  BUILD_CMD: npm ci && npm run build:libs && npm run build --workspace=@monabid/assistant-client

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - '.github/workflows/deploy.yml'
              - 'packages/assistant-client/**'
              - 'packages/ui/**'
              - 'packages/shared/**'
              - 'fixtures/auction-data/**'
              - 'package.json'
              - 'package-lock.json'

      - name: Notify started
        if: steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set +e
          TITLE="🟡 $PROJECT_NAME · frontend build started"
          BODY=$(printf "*Started* · branch \`%s\`\n\`%s\` by %s" "$GITHUB_REF_NAME" "${GITHUB_SHA:0:7}" "$GITHUB_ACTOR")
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' \
            --data "$(jq -n --arg t "$TITLE" --arg b "$BODY" "{blocks:[{type:\"header\",text:{type:\"plain_text\",text:\$t,emoji:true}},{type:\"section\",text:{type:\"mrkdwn\",text:\$b}}]}")"

  deploy:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Build fixture-backed frontend
        shell: bash
        env:
          VITE_FIXTURE_MODE: "true"
        run: |
          set -eo pipefail
          eval "$BUILD_CMD" 2>&1 | tee build.log

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eo pipefail
          npx wrangler@4 pages project create "$PROJECT_NAME" --production-branch=main 2>/dev/null || true
          npx wrangler@4 pages deploy "$PUBLISH_DIR" --project-name="$PROJECT_NAME" --branch="$GITHUB_REF_NAME" 2>&1 | tee deploy.log
          SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME" | jq -r '.result.subdomain')
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            URL="https://$SUB"
          else
            ALIAS=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-28)
            URL="https://$ALIAS.$SUB"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  notify:
    needs: [changes, deploy]
    if: always() && (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Notify result
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ needs.deploy.result }}
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          if [ "$RESULT" = "success" ]; then
            TITLE="✅ $PROJECT_NAME · frontend deployed"
            DETAIL="Frontend: ✅ <$DEPLOY_URL>"
          elif [ "$RESULT" = "cancelled" ]; then
            TITLE="⚠️ $PROJECT_NAME · frontend deploy cancelled"
            DETAIL="Frontend: ⚠️ cancelled"
          else
            TITLE="❌ $PROJECT_NAME · frontend deploy failed"
            DETAIL="Frontend: ❌ <$RUN_URL|build failed — logs>"
          fi

          BODY=$(printf "*%s* · \`%s\` by %s\n%s" "$GITHUB_REF_NAME" "${GITHUB_SHA:0:7}" "$GITHUB_ACTOR" "$DETAIL")
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' \
            --data "$(jq -n --arg t "$TITLE" --arg b "$BODY" "{blocks:[{type:\"header\",text:{type:\"plain_text\",text:\$t,emoji:true}},{type:\"section\",text:{type:\"mrkdwn\",text:\$b}}]}")"
