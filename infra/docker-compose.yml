services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monabid
      POSTGRES_USER: monabid
      POSTGRES_PASSWORD: monabid
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monabid -d monabid"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - monabid-postgres:/var/lib/postgresql/data

volumes:
  monabid-postgres:
